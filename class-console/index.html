<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Class Console — Fall 2026</title>
<style>
:root{--bg:#faf7f2;--fg:#1b1b1f;--dim:#6b6560;--line:#e2dbd0;--card:#fff;--accent:#7a1f2a;--chip:#f0eae0}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#f2f0ec;--dim:#9a948c;--line:#2e323a;--card:#1e2128;--accent:#e8a3ad;--chip:#262a32}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.15rem;margin:0 0 14px}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.nav .day{font-weight:700;font-size:1.02rem;min-width:190px}
.arrow{border:1px solid var(--line);background:var(--card);color:var(--fg);
 border-radius:8px;width:34px;height:34px;font-size:1rem;cursor:pointer;line-height:1}
.arrow:hover{border-color:var(--accent)}
.today-btn{border:1px solid var(--line);background:var(--card);color:var(--fg);
 border-radius:8px;padding:7px 12px;font-size:.8rem;cursor:pointer}
.today-btn:hover{border-color:var(--accent)}
input[type=date]{border:1px solid var(--line);background:var(--card);color:var(--fg);
 border-radius:8px;padding:6px 8px;font-size:.8rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;
 padding:5px 12px;font-size:.78rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media(prefers-color-scheme:dark){.chip.on{color:#16181d}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:14px 16px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card.today{border-color:var(--accent);border-width:2px}
.info{flex:1 1 250px;min-width:0}
.cname{font-weight:700;font-size:.95rem}
.slot{color:var(--dim);font-size:.85rem;margin-top:2px}
.meta{color:var(--dim);font-size:.74rem;margin-top:4px}
.code{font:700 1.75rem/1 ui-monospace,"SF Mono",Menlo,monospace;
 letter-spacing:.13em;color:var(--accent);cursor:pointer;white-space:nowrap}
.code:hover{opacity:.65}
.btn{border:1px solid var(--line);background:transparent;color:var(--fg);
 border-radius:8px;padding:8px 12px;font-size:.78rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.empty{color:var(--dim);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px}
h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
 margin:26px 0 10px;font-weight:700}
input[type=search]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
 background:var(--card);color:var(--fg);font-size:.9rem;margin-bottom:12px}
.grp{font-size:.72rem;font-weight:700;color:var(--dim);text-transform:uppercase;
 letter-spacing:.07em;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
#big{position:fixed;inset:0;background:var(--bg);display:none;
 flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:99;padding:24px;text-align:center}
#big.on{display:flex}
#big .who{font-size:clamp(1rem,3vw,1.6rem);color:var(--dim)}
#big .c{font:700 clamp(4rem,22vw,16rem)/1 ui-monospace,"SF Mono",Menlo,monospace;
 letter-spacing:.1em;color:var(--accent);word-break:break-all}
#big .hint{font-size:.8rem;color:var(--dim)}
.kbd{border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.75rem;
 font-family:ui-monospace,monospace}
@media print{.btn,.arrow,.chips,.today-btn,input,#big{display:none!important}}
</style></head><body>
<div class="wrap">
  <h1>Class Console</h1>

  <div class="nav">
    <button class="arrow" id="prev" title="Previous class day">&#9664;</button>
    <div class="day" id="day"></div>
    <button class="arrow" id="next" title="Next class day">&#9654;</button>
    <button class="today-btn" id="todayBtn">Today</button>
    <input type="date" id="pick">
  </div>
  <div class="chips" id="chips"></div>
  <div id="now"></div>

  <h2>All meetings</h2>
  <input type="search" id="q" placeholder="Filter — chapter, topic, date, course…">
  <div id="all"></div>
</div>
<div id="big" onclick="hide()">
  <div class="who" id="bigwho"></div>
  <div class="c" id="bigcode"></div>
  <div class="hint">click anywhere, or press <span class="kbd">Esc</span>, to close</div>
</div>
<script>
let M = null;
let DATES = [], COURSES = [], course = 'all', day = '';
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY = iso(new Date());

// localStorage can throw (private window, blocked site data, data: URLs),
// so the remembered course filter must never break the page.
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

// Called once M is available -- immediately for the local build, after
// decryption for the published one.
function boot(){
  DATES = [...new Set(M.map(m=>m.date))].filter(Boolean).sort();
  COURSES = [...new Set(M.map(m=>m.label))];
  course = store.get('cc.course') || 'all';
  if (course !== 'all' && !COURSES.includes(course)) course = 'all';
  // Land on today if it is a class day, else the next one coming up.
  day = DATES.includes(TODAY) ? TODAY : (DATES.find(d => d >= TODAY) || DATES[DATES.length-1]);
  drawChips(); drawDay(); drawAll();
}

const pretty = s => { const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,
    {weekday:'long',month:'short',day:'numeric'}); };

function matchCourse(m){ return course === 'all' || m.label === course; }

function card(m){
  const d = document.createElement('div');
  d.className = 'card' + (m.date === TODAY ? ' today' : '');
  d.innerHTML =
    '<div class="info"><div class="cname">'+m.label+'</div>'+
    '<div class="slot">'+m.slot+'</div>'+
    '<div class="meta">'+(m.date||'unscheduled')+' · '+m.meets+' · '+m.room+'</div></div>'+
    '<div class="code" title="click to copy">'+m.code+'</div>'+
    '<button class="btn">Project</button>';
  d.querySelector('.code').onclick = e => {
    navigator.clipboard?.writeText(m.code);
    const t=e.target, o=t.textContent;
    t.textContent='copied'; setTimeout(()=>t.textContent=o,700);
  };
  d.querySelector('.btn').onclick = () => show(m);
  return d;
}

function drawChips(){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  [['all','All courses'], ...COURSES.map(c=>[c,c.replace('ECON ','')])]
    .forEach(([val,txt]) => {
      const b = document.createElement('button');
      b.className = 'chip' + (course===val ? ' on' : '');
      b.textContent = txt;
      b.onclick = () => {
        course = val; store.set('cc.course',val);
        // Switching course while parked on a day it does not meet would show
        // an empty panel -- snap to that course's next meeting instead.
        if (!M.some(m => m.date === day && matchCourse(m))) {
          const pool = DATES.filter(d => M.some(m => m.date===d && matchCourse(m)));
          day = pool.find(d => d >= TODAY) || pool.find(d => d >= day)
                || pool[pool.length-1] || day;
        }
        drawChips(); drawDay(); drawAll();
      };
      box.appendChild(b);
    });
}

let shown = [];
function drawDay(){
  document.getElementById('day').textContent =
    pretty(day) + (day === TODAY ? ' · today' : '');
  document.getElementById('pick').value = day;
  const box = document.getElementById('now');
  box.innerHTML = '';
  shown = M.filter(m => m.date === day && matchCourse(m));
  if (!shown.length){
    box.innerHTML = '<div class="empty">No meeting on this day'
      + (course==='all' ? '' : ' for ' + course) + '.</div>';
    return;
  }
  shown.forEach(m => box.appendChild(card(m)));
}

function step(dir){
  const pool = DATES.filter(d => M.some(m => m.date===d && matchCourse(m)));
  const nxt = dir > 0 ? pool.find(d => d > day)
                      : [...pool].reverse().find(d => d < day);
  if (nxt){ day = nxt; drawDay(); }
}

function drawAll(){
  const all = document.getElementById('all');
  const f = document.getElementById('q').value.trim().toLowerCase();
  const terms = f.split(/\s+/).filter(Boolean);
  all.innerHTML = '';
  const rows = M.filter(m => {
    if (!matchCourse(m)) return false;
    const text = (m.label+' '+m.slot+' '+m.code).toLowerCase();
    const hay = text + ' ' + m.date;
    // A bare number means "Ch 9" / "SEC 09" / "Topic 9" -- never the 09 inside
    // a date, so numeric terms skip the date. Type a full ISO date to search
    // by day.
    return terms.every(t => /^\d+$/.test(t)
      ? new RegExp('\\b'+t+'\\b').test(text)
      : hay.includes(t));
  });
  if (!rows.length){ all.innerHTML = '<div class="empty">Nothing matches.</div>'; return; }
  let last = '';
  rows.forEach(m => {
    if (m.label !== last){
      last = m.label;
      const h = document.createElement('div');
      h.className = 'grp'; h.textContent = m.label;
      all.appendChild(h);
    }
    all.appendChild(card(m));
  });
}

function show(m){
  document.getElementById('bigwho').textContent = m.label + ' · ' + m.slot;
  document.getElementById('bigcode').textContent = m.code;
  document.getElementById('big').classList.add('on');
}
function hide(){ document.getElementById('big').classList.remove('on'); }

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('todayBtn').onclick = () => {
  day = DATES.includes(TODAY) ? TODAY : (DATES.find(d=>d>=TODAY)||day); drawDay(); };
document.getElementById('pick').onchange = e => { day = e.target.value; drawDay(); };
document.getElementById('q').addEventListener('input', drawAll);

addEventListener('keydown', e => {
  if (e.key === 'Escape') return hide();
  const typing = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if (typing) return;
  if (e.key === 'ArrowLeft')  return step(-1);
  if (e.key === 'ArrowRight') return step(1);
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= shown.length) show(shown[n-1]);
});


</script>
<div id="gate" style="position:fixed;inset:0;background:var(--bg);z-index:200;
 display:flex;align-items:center;justify-content:center;padding:24px">
  <form id="gateForm" style="max-width:340px;width:100%;text-align:center">
    <div style="font:600 15px -apple-system,sans-serif;margin-bottom:14px">Class Console</div>
    <input id="gatePass" type="password" autofocus required autocomplete="off"
      placeholder="Passphrase"
      style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
             background:var(--card);color:var(--fg);font-size:14px">
    <button type="submit" style="width:100%;padding:10px;margin-top:10px;background:var(--accent);
      color:#fff;border:0;border-radius:8px;font:600 14px -apple-system,sans-serif;cursor:pointer">
      Unlock</button>
    <div id="gateMsg" style="color:var(--accent);font:13px -apple-system,sans-serif;
      margin-top:10px;min-height:18px"></div>
  </form>
</div>

async function unlock(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2',
                                             false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const clear = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(clear));
}

function start(data){
  M = data;
  document.getElementById('gate').remove();
  boot();
}

  if (saved){
    try { return start(await unlock(saved)); }
    catch(e){ store.set('cc.pass',''); }
  }
  document.getElementById('gate').style.display = 'flex';
})();

document.getElementById('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('gateMsg');
  const v = document.getElementById('gatePass').value;
  msg.textContent = 'Checking…';
  try {
    const data = await unlock(v);
    store.set('cc.pass', v);
    start(data);
  } catch(err){
    msg.textContent = 'Incorrect passphrase.';
    document.getElementById('gatePass').value = '';
    document.getElementById('gatePass').focus();
  }
});
</script>
</body></html>
