# Publishes the repo to GitHub Pages on every push to main.
#
# Replaces the legacy branch builder. Nothing is built: the site is the
# repo as-is (.nojekyll was already set), minus .git and .github, which
# upload-pages-artifact leaves out. fetch-depth 1 means only the current
# files are checked out, never the 2 GB of history.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Several sessions push here; let each deploy finish, newest one last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
